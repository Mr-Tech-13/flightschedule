services:
  app:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm start"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-flightdeck}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-flightdeck}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DEFAULT_STATION: ${DEFAULT_STATION:-Station}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/New_York}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - ./data:/app/data
      - ./private:/app/private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flightdeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flightdeck}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flightdeck} -d ${POSTGRES_DB:-flightdeck}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-flightdeck}
      POSTGRES_DB: ${POSTGRES_DB:-flightdeck}
    volumes:
      - ./data/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "while true; do pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -Fc -f /backups/nightly-$$(date +%Y-%m-%d).dump && find /backups -type f -name 'nightly-*.dump' -mtime +29 -delete; sleep 86400; done"]
volumes:
  node_modules:
