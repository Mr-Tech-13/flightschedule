services:
  app:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm start"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/flightschedule.pgdata
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEFAULT_STATION: ${DEFAULT_STATION:-Station}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/New_York}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - ./data:/app/data
      - ./private:/app/private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  node_modules:
